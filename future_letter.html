<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter to my Future Self</title>
    <style>
        body {
            background-color: #f2c0d1;
            display: flex;
            justify-content: center;
            padding: 50px;
            font-family: 'Courier New', Courier, monospace;
        }

        .letter-container {
            background: #faf6f1;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            position: relative;
        }

        /* Red margin line for the paper look */
        .letter-container::before {
            content: '';
            position: absolute;
            top: 0; left: 40px;
            height: 100%;
            width: 1px;
            background: #de85a3;
        }

        h2 { text-align: center; color: #1b100a; }

        textarea {
            width: 100%;
            height: 300px;
            border: none;
            background: repeating-linear-gradient(transparent, transparent 30px, #add8e6 30px, #add8e6 31px);
            line-height: 31px;
            padding-left: 50px;
            font-size: 18px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="date"] {
            padding: 10px;
            border: 1px solid #1b100a;
            border-radius: 4px;
        }

        button {
            background-color: #de85a3;
            color: #f6dee6;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover { background-color: #d17191; }
    </style>
</head>
<body>

<div class="letter-container">
    <h2>Dear Future Me...</h2>
    <textarea id="letterContent" placeholder="Write your thoughts here..."></textarea>
    
    <div class="controls">
        <label for="revealDate">When should this reappear?</label>
        <input type="date" id="revealDate">
        <button onclick="sendToFuture()">Send to the Future</button>
    </div>
</div>

<script>
    function sendToFuture() {
        const text = document.getElementById('letterContent').value;
        const date = document.getElementById('revealDate').value;

        if (!text || !date) {
            alert("Please write a letter to your future self and pick the date you'd like to recieve it!");
            return;
        }

        // Logic explanation: 
        // In a real app, you'd send 'text' and 'date' to a database (Firebase/Supabase).
        // For a local demo, we'll save it to your browser's storage.
        const letterData = { text, date };
        localStorage.setItem('futureLetter', JSON.stringify(letterData));

        alert("Letter sent! It's tucked away until " + date);
        
        // Clear the form
        document.getElementById('letterContent').value = "";
    }

    // This part checks if a letter should "reappear" today
    window.onload = function() {
        const savedLetter = JSON.parse(localStorage.getItem('futureLetter'));
        if (savedLetter) {
            const today = new Date().toISOString().split('T')[0];
            if (today >= savedLetter.date) {
                alert("✨ A letter from your past has arrived! ✨\n\n" + savedLetter.text);
                localStorage.removeItem('futureLetter'); // Remove after reading
            }
        }
    };
</script>
