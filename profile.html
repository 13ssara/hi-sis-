<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        /* Define your color palette and overall theme */
        :root {
            --bg-color: #fdf6f6; /* Very pale pink background */
            --header-bg: #ffffff; /* White header */
            --text-color: #555555;
            --main-pink: #ffb6c1; /* Your specific light pink */
            --accent-pink: #ffdae0; /* Softer pink for hover/inputs */
            --text-light: #888888;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-color);
        }

        /* HEADER & TOOLBAR (Matching your required style) */
        header {
            padding: 15px 30px;
            display: flex;
            justify-content: flex-end;
            background: var(--header-bg);
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .icons { display: flex; gap: 20px; }
        .icon { color: var(--text-light); text-decoration: none; transition: 0.3s ease; }
        .icon:hover { color: var(--text-color); }
        .icon.active { color: var(--main-pink); } /* Active page indicator */

        /* PROFILE CONTAINER */
        .main-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* LEFT SIDE: EDITABLE AREA */
        .profile-setup {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .profile-setup h3 {
            margin-top: 0;
            color: var(--main-pink);
            font-weight: 600;
        }

        /* Placeholder PFP */
        .avatar-placeholder {
            width: 120px; height: 120px;
            background-color: #eee;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-light);
            border: 4px solid var(--accent-pink);
        }

        /* Editing Controls */
        .edit-controls { text-align: left; margin-top: 20px; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 14px; color: var(--text-light); margin-bottom: 5px; }
        
        .profile-setup input, .profile-setup select, .profile-setup textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-family: inherit;
        }

        .profile-setup textarea { resize: none; height: 80px; }
        .profile-setup input:focus, .profile-setup select:focus, .profile-setup textarea:focus {
            outline: none;
            border-color: var(--main-pink);
            background-color: var(--bg-color);
        }

        .save-btn {
            background-color: var(--main-pink);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: 0.3s;
        }
        .save-btn:hover { background-color: #ffa4b1; }

        /* RIGHT SIDE: VIEW AREA */
        .profile-display {
            display: flex; flex-direction: column; gap: 30px;
        }

        .display-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .user-identity { text-align: center; }
        .user-identity h1 { margin: 10px 0 5px 0; color: #333; }
        .pronouns { color: var(--main-pink); font-style: italic; margin-bottom: 15px; }

        /* The space you requested for your future login system */
        .username-badge {
            display: inline-block;
            background-color: var(--accent-pink);
            color: var(--main-pink);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .user-description {
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            text-align: left;
        }

        /* LETTER STATUS AREA */
        .letters-overview h2 {
            margin-top: 0;
            color: var(--text-color);
            font-weight: 600;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-color);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid var(--accent-pink);
        }

        .stat-num { font-size: 32px; font-weight: 700; color: var(--main-pink); }
        .stat-label { font-size: 14px; color: var(--text-light); }

        .action-btn {
            display: block;
            background-color: white;
            color: var(--main-pink);
            border: 2px solid var(--main-pink);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        .action-btn:hover { background-color: var(--main-pink); color: white; }

        /* Viewable PFP in display */
        .pfp-view {
            width: 80px; height: 80px;
            border-radius: 50%;
            margin: 0 auto;
            border: 3px solid var(--main-pink);
        }

    </style>
</head>
<body>

    <header>
        <div class="icons">
            <a href="profile.html" id="profile" class="icon active"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z"/></svg></a>
            <a href="index.html" id="home" class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg></a>
            <a href="settings.html" id="settings" class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1 1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
        </div>
    </header>

    <div class="main-container">

        <aside class="profile-setup">
            <h3>Profile Setup</h3>
            <div class="avatar-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z"/></svg>
            </div>
            
            <div class="edit-controls">
                <div class="control-group">
                    <label>First Name</label>
                    <input type="text" id="editName" placeholder="Enter name">
                </div>
                <div class="control-group">
                    <label>Age</label>
                    <input type="number" id="editAge" placeholder="00">
                </div>
                <div class="control-group">
                    <label>Pronouns</label>
                    <select id="editPronouns">
                        <option value="">Select...</option>
                        <option value="she/her">she/her</option>
                        <option value="he/him">he/him</option>
                        <option value="they/them">they/them</option>
                        <option value="other">other</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Description</label>
                    <textarea id="editDesc" placeholder="A brief note about yourself..."></textarea>
                </div>
            </div>

            <button class="save-btn" onclick="saveProfile()">Save Changes</button>
        </aside>

        <main class="profile-display">
            
            <section class="display-card user-identity">
                <div class="pfp-view avatar-placeholder" style="color:#ffb6c1; border-color:#ffb6c1;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z"/></svg>
                </div>

                <h1 id="viewName">Your Name</h1>
                <div id="viewPronouns" class="pronouns">Pronouns</div>

                <div class="username-badge">@username_placeholder</div>
                
                <p id="viewDesc" class="user-description">Your description will appear here after you save.</p>
            </section>

            <section class="display-card letters-overview">
                <h2>Letter Dashboard</h2>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-num">0</div>
                        <div class="stat-label">Letters in Transit</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num">0</div>
                        <div class="stat-label">Letters Reappeared</div>
                    </div>
                </div>

                <a href="#" class="action-btn">View Arrived Letters</a>
            </section>

        </main>

    </div>

    <script>
        // A basic function to update the viewer from the editor
        function saveProfile() {
            // Get values from inputs
            const name = document.getElementById('editName').value;
            const pronouns = document.getElementById('editPronouns').value;
            const desc = document.getElementById('editDesc').value;

            // Simple update: We aren't handling 'Age' in the view, just inputs.
            // You can add it if you like.

            // Set values in the view display
            if(name) document.getElementById('viewName').textContent = name;
            if(pronouns) document.getElementById('viewPronouns').textContent = pronouns;
            if(desc) document.getElementById('viewDesc').textContent = desc;

            alert("Profile updated!");
        }
    </script>

</body>
</html>
