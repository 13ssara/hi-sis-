<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends - HiSis</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #1b100a; color: #f6dee6; min-height: 100vh; }
        .page-wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .logo { font-family: 'Playfair Display', serif; font-size: 36px; color: #f6dee6; text-decoration: none; }
        .back-link { color: #f6dee6; text-decoration: none; border: 1px solid rgba(255, 217, 231, 0.4); padding: 10px 16px; border-radius: 16px; }
        .panel { background: rgba(255, 242, 244, 0.08); border: 1px solid rgba(255, 217, 231, 0.16); border-radius: 30px; padding: 40px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 20px; }
        .friends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .friend-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,217,231,0.12); border-radius: 20px; padding: 20px; text-align: center; }
        .friend-pic { width: 60px; height: 60px; border-radius: 50%; background: #de85a3; display: inline-flex; align-items: center; justify-content: center; color: #1b100a; font-weight: 700; margin-bottom: 10px; }
        .friend-name { font-weight: 600; }
        .empty-state { color: #c9aaa0; font-style: italic; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="top-bar">
            <a href="/" class="logo">Hi<span style="color:#de85a3;">Sis</span></a>
            <a href="/profile" class="back-link">← Back to Profile</a>
        </div>

        <div class="panel">
            <div class="section-title">Your Friends</div>
            {% if friends %}
            <div class="friends-grid">
                {% for friend in friends %}
                <div class="friend-card">
                    <div class="friend-pic">{{ friend.name[:2].upper() if friend.name else friend.username[:2].upper() }}</div>
                    <div class="friend-name">{{ friend.name or friend.username }}</div>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <div class="empty-state">No friends yet. Add some friends from your profile!</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
