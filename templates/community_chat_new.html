<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Chat - HiSis Comunity</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #1b100a; color: #f6dee6; min-height: 100vh; }
        .page-wrap { max-width: 760px; margin: 0 auto; padding: 36px 20px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #f6dee6; text-decoration: none; border: 1px solid rgba(246,222,230,0.23); padding: 10px 14px; border-radius: 16px; }
        .panel { background: rgba(255,242,244,0.08); border: 1px solid rgba(255,217,231,0.14); border-radius: 28px; padding: 32px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 18px; }
        label { display: block; margin-bottom: 10px; color: #f6dee6; font-weight: 600; }
        input { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,217,231,0.18); border-radius: 16px; padding: 14px 16px; color: #f6dee6; margin-bottom: 22px; }
        .button { background: linear-gradient(135deg, #f2c0d1 0%, #de85a3 100%); color: #1b100a; border: none; border-radius: 24px; padding: 14px 24px; font-weight: 700; cursor: pointer; }
        .error { color: #ff9aa5; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a href="/community" class="back-link">← Back to Comunity</a>
        <div class="panel">
            <div class="section-title">Start a private chat</div>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <form method="POST">
                <label for="friend_username">Friend username</label>
                <input id="friend_username" name="friend_username" type="text" placeholder="Enter your friend's username" required>
                <button type="submit" class="button">Create Chat</button>
            </form>
            {% if friends %}
            <div style="margin-top: 24px;">
                <div style="color: #f6dee6; font-weight: 600; margin-bottom: 12px;">Your Friends:</div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    {% for friend in friends %}
                    <button type="button" onclick="document.getElementById('friend_username').value='{{ friend.username }}'" class="button" style="padding: 8px 12px; font-size: 14px;">{{ friend.name or friend.username }}</button>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
