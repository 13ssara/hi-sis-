<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiSis - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
            min-height: 100vh;
            background: repeating-linear-gradient(90deg,
                #f1aed0 0px,
                #f1a9ce 36px,
                #1c0d02 10px,
                #1c0d02 72px
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .page-card {
            background-color: #fff9f3;
            border-radius: 28px;
            padding: 40px 35px;
            width: min(100%, 760px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.14);
            position: relative;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #4a3728;
            font-weight: 700;
            text-decoration: none;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            align-items: center;
        }

        .nav a {
            color: #4a3728;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 12px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav a:hover {
            background-color: rgba(212, 104, 159, 0.1);
            color: #c85685;
        }

        .hero {
            text-align: center;
            padding: 20px 15px 10px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #4a3728;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
        }

        .hero p {
            color: #6b5345;
            font-size: 17px;
            line-height: 1.75;
            margin-bottom: 28px;
            max-width: 640px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4689f 0%, #c85685 100%);
            color: #fff;
            padding: 14px 34px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hero .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(200, 85, 133, 0.25);
        }

        .bottom-stripe {
            margin-top: 30px;
            background-color: #d4689f;
            color: #fff9f3;
            text-align: center;
            padding: 12px 0;
            border-radius: 16px;
            font-weight: 600;
            letter-spacing: 0.6px;
            box-shadow: 0 10px 28px rgba(212, 104, 159, 0.18);
        }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="page-header">
            <a href="/" class="logo">HiSis</a>
            <nav class="nav">
                <a href="/profile">Profile</a>
                <a href="/community">Comunity</a>
                <a href="/character">Character</a>
                <a href="{{ url_for('library') }}">Library</a>
                <a href="/journal">Journal</a>
                <a href="/read-journals">Read</a>
                <a href="/letter">Letter</a>
                <a href="/threads">Threads</a>
                <a href="/logout">Log Out</a>
            </nav>
        </div>

        <div class="hero">
            <h1>Welcome back, sis.</h1>
            <p>Take a moment to breathe, write your heart out, and explore the pages made for you. Your safe space is ready whenever you are.</p>
            <a href="/community" class="cta-btn">Open Comunity</a>
        </div>

        <div class="bottom-stripe">hi, sis!</div>
    </div>
</body>
</html>
