<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Thread - HiSis Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #1b100a; color: #f6dee6; min-height: 100vh; }
        .page-wrap { max-width: 840px; margin: 0 auto; padding: 36px 22px; }
        .back-link { display: inline-block; margin-bottom: 24px; color: #f6dee6; text-decoration: none; border: 1px solid rgba(246,222,230,0.23); padding: 10px 14px; border-radius: 16px; }
        .panel { background: rgba(255,242,244,0.08); border: 1px solid rgba(255,217,231,0.14); border-radius: 28px; padding: 32px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 18px; }
        label { display: block; margin-bottom: 10px; color: #f6dee6; font-weight: 600; }
        input, textarea, select { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,217,231,0.18); border-radius: 16px; padding: 14px 16px; color: #f6dee6; margin-bottom: 20px; }
        textarea { min-height: 180px; resize: vertical; }
        .button { background: linear-gradient(135deg, #f2c0d1 0%, #de85a3 100%); color: #1b100a; border: none; border-radius: 24px; padding: 14px 24px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a href="/community" class="back-link">← Back to Comunity</a>
        <div class="panel">
            <div class="section-title">Create a new thread</div>
            <form method="POST">
                <label for="title">Thread title</label>
                <input id="title" name="title" type="text" placeholder="Write a short topic title" required>
                <label for="content">Message</label>
                <textarea id="content" name="content" placeholder="Share your thought, ask your question, or post your story" required></textarea>
                <label for="is_public">Visibility</label>
                <select id="is_public" name="is_public">
                    <option value="public" selected>Public thread</option>
                    <option value="private">Private thread</option>
                </select>
                <button type="submit" class="button">Post Thread</button>
            </form>
        </div>
    </div>
</body>
</html>
